AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Aplicacion Serverless de Registro de Siniestros Vehiculares

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Ambiente de despliegue (dev, staging, prod)
  ProjectName:
    Type: String
    Default: siniestros
    Description: Prefijo de los recursos 
  NodeRuntime:
    Type: String
    Default: nodejs22.x
    AllowedValues: [nodejs22.x, nodejs24.x]
    Description: Runtime de Lambda (Node.js 22 LTS sobre Amazon Linux 2023)
  LambdaMemorySize:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 3008
    Description: Memoria RAM asignada a las funciones Lambda (MB)
  LambdaTimeout:
    Type: Number
    Default: 15
    MinValue: 5
    MaxValue: 120
    Description: Tiempo maximo de ejecucion de cada Lambda (segundos)
  DeploymentPreferenceType:
    Type: String
    Default: AllAtOnce
    AllowedValues:
      - AllAtOnce
      - Linear10PercentEvery1Minute
      - Canary10Percent5Minutes
      - Canary10Percent10Minutes
    Description: Estrategia de despliegue gradual con AWS CodeDeploy
  EnableWaf:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Activa AWS WAFv2 en CloudFront (true en prod)
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 90, 180, 365]
    Description: Dias de retencion de logs en CloudWatch 
  CustomDomainCertificateArn:
    Type: String
    Default: ''
    Description: ARN opcional de certificado ACM en us-east-1

Conditions:
  IsProd: !Equals [!Ref Env, 'prod']
  ShouldEnableWaf: !Equals [!Ref EnableWaf, 'true']
  HasCustomCertificate: !Not [!Equals [!Ref CustomDomainCertificateArn, '']]

Globals:
  Function:
    Runtime: !Ref NodeRuntime
    Architectures:
      - arm64
    MemorySize: !Ref LambdaMemorySize
    Timeout: !Ref LambdaTimeout
    Tracing: Active
    KmsKeyArn: !GetAtt AppKmsKey.Arn
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        ENV: !Ref Env
        CLAIMS_TABLE_NAME: !Ref ClaimsTable
        REPORTS_BUCKET_NAME: !Ref ReportsBucket
        INTEGRATION_SECRET_ARN: !Ref IntegrationSecret
        KMS_KEY_ARN: !GetAtt AppKmsKey.Arn

Resources:
  #  SEGURIDAD : KMS Key (Rotacion activa) + Secrets Manager
  AppKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Llave KMS CMK para cifrar PII en DynamoDB, S3 Documentos y Secrets Manager
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAdminPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: AllowSNSAndCloudWatchAlarms
            Effect: Allow
            Principal:
              Service:
                - sns.amazonaws.com
                - cloudwatch.amazonaws.com
            Action:
              - 'kms:GenerateDataKey*'
              - 'kms:Decrypt'
            Resource: '*'

  IntegrationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/${Env}/integration-credentials-${AWS::StackName}'
      Description: Credenciales de integracion cifradas con KMS 
      KmsKeyId: !Ref AppKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"provider":"AsistenciaVehicularHDI"}'
        GenerateStringKey: 'apiKey'
        PasswordLength: 24
        ExcludePunctuation: true

  #  CAPA DE DATOS: DynamoDB Table (On-Demand + PITR + KMS) y S3 Documentos
  ClaimsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: !Sub '${ProjectName}-${Env}-claims'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: claimId
          AttributeType: S
      KeySchema:
        - AttributeName: claimId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref AppKmsKey

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Env}-reports-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt AppKmsKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: SFCComplianceRetentionRule
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
              - TransitionInDays: 365
                StorageClass: GLACIER_IR

  #  API GATEWAY REST + COGNITO USER POOL
  AgentsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${Env}-agents-pool'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-${Env}-api-access'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt AppKmsKey.Arn

  ApiGatewayLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccountConfig:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayLoggingRole.Arn

  SiniestrosApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccountConfig
    Properties:
      Name: !Sub '${ProjectName}-${Env}-api'
      StageName: !Ref Env
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.authorizer.claims.email","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","latency":"$context.responseLatency"}'
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAgentAuthorizer:
            UserPoolArn: !GetAtt AgentsUserPool.Arn

  # COMPUTE: Funciones Lambda (Node.js 22 arm64) + CodeDeploy Canary + LogGroup SFC
  ClaimsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-claims'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt AppKmsKey.Arn
      DataProtectionPolicy:
        Name: SFC-PII-DataProtectionPolicy
        Description: Enmascara automaticamente PII (Email, Telefono, Credenciales) en CloudWatch Logs desde IaC sin depender del backend
        Version: '2021-06-01'
        Statement:
          - Sid: AuditPiiPolicy
            DataIdentifier:
              - arn:aws:dataprotection::aws:data-identifier/EmailAddress
              - arn:aws:dataprotection::aws:data-identifier/AwsSecretKey
            Operation:
              Audit:
                FindingsDestination: {}
          - Sid: RedactPiiPolicy
            DataIdentifier:
              - arn:aws:dataprotection::aws:data-identifier/EmailAddress
              - arn:aws:dataprotection::aws:data-identifier/AwsSecretKey
            Operation:
              Deidentify:
                MaskConfig: {}

  ClaimsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ClaimsFunctionLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-claims'
      Description: Registro, consulta y actualizacion de siniestros
      CodeUri: ../backend/claims
      Handler: index.handler
      AutoPublishAlias: live
      DeploymentPreference:
        Type: !Ref DeploymentPreferenceType
        Alarms:
          - !Ref ClaimsFunctionErrorsAlarm
          - !Ref ApiGateway5xxAlarm
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClaimsTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref IntegrationSecret
        - KMSDecryptPolicy:
            KeyId: !Ref AppKmsKey
        - Statement:
            - Effect: Allow
              Action:
                - kms:GenerateDataKey*
                - kms:Encrypt
              Resource: !GetAtt AppKmsKey.Arn
      Events:
        CreateClaim:
          Type: Api
          Properties:
            RestApiId: !Ref SiniestrosApi
            Path: /api/v1/claims
            Method: POST
        GetClaim:
          Type: Api
          Properties:
            RestApiId: !Ref SiniestrosApi
            Path: /api/v1/claims/{id}
            Method: GET
        UpdateClaim:
          Type: Api
          Properties:
            RestApiId: !Ref SiniestrosApi
            Path: /api/v1/claims/{id}
            Method: PATCH

  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-documents'
      Description: Generacion y almacenamiento de reportes PDF en S3
      CodeUri: ../backend/documents
      Handler: index.handler
      AutoPublishAlias: live
      DeploymentPreference:
        Type: !Ref DeploymentPreferenceType
        Alarms:
          - !Ref DocumentsFunctionErrorsAlarm
          - !Ref ApiGateway5xxAlarm
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ClaimsTable
        - S3CrudPolicy:
            BucketName: !Ref ReportsBucket
        - KMSDecryptPolicy:
            KeyId: !Ref AppKmsKey
        - Statement:
            - Effect: Allow
              Action:
                - kms:GenerateDataKey*
                - kms:Encrypt
              Resource: !GetAtt AppKmsKey.Arn
      Events:
        GenerateReport:
          Type: Api
          Properties:
            RestApiId: !Ref SiniestrosApi
            Path: /api/v1/documents/report
            Method: POST

  # FRONTEND SPA (S3 Bucket Privado + CloudFront CDN + OAC + WAFv2)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Env}-frontend-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Env}-oac-${AWS::StackName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendWebACL:
    Type: AWS::WAFv2::WebACL
    Condition: ShouldEnableWaf
    Properties:
      Name: !Sub '${ProjectName}-${Env}-cloudfront-waf'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}${Env}WafMetric'
      Rules:
        - Name: AWSManagedCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${ProjectName}${Env}CommonRules'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'CDN Siniestros (${ProjectName}-${Env})'
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        WebACLId: !If [ShouldEnableWaf, !GetAtt FrontendWebACL.Arn, !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCustomCertificate
          - AcmCertificateArn: !Ref CustomDomainCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiGatewayOrigin
            DomainName: !Sub '${SiniestrosApi}.execute-api.${AWS::Region}.amazonaws.com'
            OriginPath: !Sub '/${Env}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  #OBSERVABILIDAD: SNS + Alarmas Criticas (Rollback) + Dashboard DORA

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Env}-critical-alerts'
      KmsMasterKeyId: !Ref AppKmsKey

  # CASO DE USO IA #3 (ChatOps en Tiempo Real):
  # Alarma CloudWatch -> AlertsTopic -> IncidentAiFunction (Logs + Bedrock) -> ChatOpsSummaryTopic
  ChatOpsSummaryTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Env}-chatops-summary'
      DisplayName: !Sub 'HDI Siniestros (${Env}) - RCA IA Bedrock'
      KmsMasterKeyId: !Ref AppKmsKey

  IncidentAiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Env}-incident-ai'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt AppKmsKey.Arn

  IncidentAiFunction:
    Type: AWS::Serverless::Function
    DependsOn: IncidentAiFunctionLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${Env}-incident-ai'
      Description: ChatOps RCA con Amazon Bedrock ante alarmas criticas (Caso de Uso IA #3)
      CodeUri: ../backend/incident-ai
      Handler: index.handler
      Environment:
        Variables:
          PROJECT_NAME: !Ref ProjectName
          CHATOPS_TOPIC_ARN: !Ref ChatOpsSummaryTopic
          BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
          CLAIMS_LOG_GROUP: !Sub '/aws/lambda/${ProjectName}-${Env}-claims'
          DOCUMENTS_LOG_GROUP: !Sub '/aws/lambda/${ProjectName}-${Env}-documents'
          API_LOG_GROUP: !Sub '/aws/apigateway/${ProjectName}-${Env}-api-access'
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ChatOpsSummaryTopic.TopicName
        - KMSDecryptPolicy:
            KeyId: !Ref AppKmsKey
        - Statement:
            - Sid: AllowKmsForEncryptedSnsAndLogs
              Effect: Allow
              Action:
                - kms:GenerateDataKey*
                - kms:Encrypt
              Resource: !GetAtt AppKmsKey.Arn
            - Sid: AllowReadApplicationLogsForRca
              Effect: Allow
              Action:
                - logs:FilterLogEvents
                - logs:GetLogEvents
                - logs:DescribeLogStreams
              Resource:
                - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${Env}-*'
                - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${ProjectName}-${Env}-*'
            - Sid: AllowBedrockNovaMicroRca
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0'
      Events:
        CloudWatchAlarmEvent:
          Type: SNS
          Properties:
            Topic: !Ref AlertsTopic

  ClaimsFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Env}-claims-lambda-errors'
      AlarmDescription: Dispara rollback automatico en CodeDeploy si la Lambda claims presenta errores
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ClaimsFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  DocumentsFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Env}-documents-lambda-errors'
      AlarmDescription: Dispara rollback automatico en CodeDeploy si la Lambda documents presenta errores
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DocumentsFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Env}-apigw-5xx-errors'
      AlarmDescription: Alerta critica por errores 5XX en API Gateway REST
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub '${ProjectName}-${Env}-api'
        - Name: Stage
          Value: !Ref Env
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  ObservabilityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-${Env}-operations-dora'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway - Peticiones y Errores 5XX (${Env})",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "${ProjectName}-${Env}-api", "Stage", "${Env}" ],
                  [ ".", "5XXError", ".", ".", ".", "." ]
                ],
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambdas claims & documents - Invocaciones y Errores",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ClaimsFunction}" ],
                  [ ".", "Errors", ".", "${ClaimsFunction}" ],
                  [ ".", "Invocations", ".", "${DocumentsFunction}" ],
                  [ ".", "Errors", ".", "${DocumentsFunction}" ]
                ],
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Metricas DORA (Deployment Frequency, Lead Time, CFR, MTTR)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "SiniestrosDORA", "DeploymentFrequency", "Environment", "${Env}" ],
                  [ ".", "LeadTimeMinutes", ".", "${Env}" ],
                  [ ".", "ChangeFailureCount", ".", "${Env}" ],
                  [ ".", "MeanTimeToRestoreMinutes", ".", "${Env}" ]
                ],
                "period": 300,
                "stat": "Sum"
              }
            }
          ]
        }

Outputs:
  ApiEndpointUrl:
    Description: URL directa del stage en API Gateway REST
    Value: !Sub 'https://${SiniestrosApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}/api/v1'
  CloudFrontUrl:
    Description: URL publica HTTPS de la aplicacion en CloudFront (SPA + /api/v1/*)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  CloudFrontDistributionId:
    Description: ID de la distribucion CloudFront para invalidacion de cache
    Value: !Ref CloudFrontDistribution
  FrontendBucketName:
    Description: Bucket S3 donde se sincroniza el Frontend SPA
    Value: !Ref FrontendBucket
  ReportsBucketName:
    Description: Bucket S3 cifrado con KMS donde se almacenan los reportes PDF
    Value: !Ref ReportsBucket
  ClaimsTableName:
    Description: Nombre de la tabla DynamoDB de siniestros
    Value: !Ref ClaimsTable
  ChatOpsSummaryTopicArn:
    Description: Topico SNS donde la Lambda IncidentAI publica el diagnostico RCA de Amazon Bedrock (Caso IA #3)
    Value: !Ref ChatOpsSummaryTopic
