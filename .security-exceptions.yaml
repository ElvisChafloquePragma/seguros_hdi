# ==============================================================================
# Registro Auditable de Excepciones de Seguridad (Cumplimiento SFC CE 007/2018)
# Cualquier hallazgo que requiera pase temporal o excepción arquitectónica
# debe registrarse aquí mediante Pull Request con aprobador y fecha de expiración.
# ==============================================================================
version: "1.0"
policy:
  block_on:
    - SECRETS_DETECTED
    - CRITICAL
    - HIGH_WITH_FIX
  warn_on:
    - MEDIUM
    - LOW
  sla_days:
    CRITICAL: 7
    HIGH: 15
    MEDIUM: 30
    LOW: 90

exceptions:
  - id: CKV_AWS_116
    tool: checkov
    severity: LOW
    resource: "AWS::Serverless::Function"
    justification: "Invocacion sincronica REST desde API Gateway; errores y reintentos se gestionan con HTTP status codes, alarmas CloudWatch y rollback CodeDeploy."
    approved_by: "Arquitectura de Seguridad / Oficial de Cumplimiento SFC"
    expires_on: "2027-06-30"

  - id: CKV_AWS_117
    tool: checkov
    severity: LOW
    resource: "AWS::Serverless::Function"
    justification: "Arquitectura 100% Serverless sin bases de datos relacionales en VPC. DynamoDB, S3 y Secrets Manager se consumen via TLS e IAM SigV4. Evita sobrecosto de $32/mes de NAT Gateway."
    approved_by: "Arquitectura de Seguridad / FinOps"
    expires_on: "2027-06-30"

  - id: CKV_AWS_115
    tool: checkov
    severity: LOW
    resource: "AWS::Serverless::Function"
    justification: "El control de concurrencia y proteccion contra sobrecargas se implementa en la capa de borde mediante throttling en API Gateway y WAFv2, permitiendo auto-escalado elastico sin limites artificiales."
    approved_by: "Arquitectura de Seguridad"
    expires_on: "2027-06-30"

  - id: CKV_AWS_120
    tool: checkov
    severity: LOW
    resource: "AWS::Serverless::Api"
    justification: "El cacheo de API Gateway genera un sobrecosto fijo (~$14/mes por stage). Las peticiones estaticas y GETs se cachean en CloudFront CDN en el borde."
    approved_by: "FinOps / Arquitectura Cloud"
    expires_on: "2027-06-30"

  - id: CKV_AWS_18
    tool: checkov
    severity: LOW
    resource: "AWS::S3::Bucket"
    justification: "El registro de acceso a nivel de servidor se delega a la cuenta centralizada de auditoria/seguridad (modelo multi-cuenta AWS Control Tower / SFC). La trazabilidad se realiza con CloudTrail."
    approved_by: "Oficial de Seguridad de la Informacion (CISO)"
    expires_on: "2027-06-30"

  - id: CKV_AWS_86
    tool: checkov
    severity: LOW
    resource: "AWS::CloudFront::Distribution"
    justification: "Los logs de acceso de CloudFront se centralizan en bucket corporativo en arquitectura multi-cuenta. El monitoreo en tiempo real se realiza con CloudWatch y metricas de WAFv2."
    approved_by: "Oficial de Seguridad de la Informacion (CISO)"
    expires_on: "2027-06-30"

  - id: CKV_AWS_174
    tool: checkov
    severity: MEDIUM
    resource: "AWS::CloudFront::Distribution"
    justification: "Al utilizar el dominio por defecto *.cloudfront.net sin certificado ACM personalizado en dev/staging, AWS gestiona la negociacion TLS. En produccion con dominio propio se impone TLSv1.2_2021."
    approved_by: "Arquitectura de Seguridad"
    expires_on: "2027-06-30"
